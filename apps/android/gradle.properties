org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# A plain `test` run compares every catalogue snapshot with its reference image, so
# `pnpm test:android` and CI fail on a screen that changed. `pnpm snap:android:record` records the
# references again. See `scripts/snap-android.mjs`.
roborazzi.test.verify=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The version a release carries. `scripts/release.mjs` is the only thing that edits these;
# `app/build.gradle.kts` reads them as ordinary Gradle properties, so `-PversionName=` on the
# command line still wins for a one-off build.
versionName=0.2.0
versionCode=5
