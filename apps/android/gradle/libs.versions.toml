# Single source of dependency versions. Never write a version literal in a
# build script — add it here.
[versions]
agp = "9.3.1"
# AGP 9 compiles Kotlin itself, but the Compose compiler is still a separate
# plugin and its version must track the Kotlin version AGP uses.
kotlin = "2.4.10"
# KSP's version tracks Kotlin's exactly; the suffix is its own build number.
ksp = "2.3.9"
room = "2.8.4"
coreKtx = "1.19.0"
# `@RequiresExtension` and `@ChecksSdkIntAtLeast`. The PDF text API lives in a
# mainline module, and these are the only way to tell lint that a check on the
# extension level is a real guard rather than a boolean. ADR-0012.
androidxAnnotation = "1.10.0"
jcifsNg = "2.1.10"
# Not a library this app calls. jcifs-ng declares 1.76 and hands it the SPNEGO
# tokens an SMB server sends during session setup, and 1.76 is inside the
# CVE-2025-8885 range: an object identifier with an oversized arc makes
# ASN1ObjectIdentifier allocate without bound, so a hostile or spoofed NAS can
# have the app killed for memory pressure whenever the reader opens that share.
# Fixed in 1.78; 1.84 is current. Applied as a constraint in :core:smb rather
# than as a dependency, because nothing here imports BouncyCastle.
bouncycastle = "1.84"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# ADR-0005: Readium renders reflowable EPUB. iOS pins the same 3.x line.
readium = "3.3.0"
# Readium's EPUB navigator is a Fragment, so one screen needs a FragmentActivity.
fragment = "1.8.9"
# Readium's AAR metadata requires core library desugaring.
desugar = "2.1.5"
composeBom = "2026.08.00"
# Material 3 Expressive: `MaterialExpressiveTheme` and `MotionScheme` are
# still internal in material3 1.4.0, so the 1.5.0 alpha line is the only way
# to use them. Pinned explicitly rather than taken from the BOM. Known risk,
# recorded in apps/android/README.md — move to 1.5.0 stable when it ships.
material3 = "1.5.0-alpha26"
# The navigation shell. `NavigationSuiteScaffold` places the three destinations as a
# short navigation bar on a phone and a wide rail on a tablet. It is published on the
# material3 line and declares a strict dependency on material3 at the identical
# version, so it takes that version ref rather than one of its own — the two can only
# move together. Nothing this app uses from it is experimental at alpha26: the
# scaffold, its item scope, `NavigationSuiteType` and
# `NavigationSuiteScaffoldDefaults.navigationSuiteType` are all stable API there,
# which is why adding the shell did **not** require the alpha pin above to move.
#
# The adaptive libraries are a different line and a stable one: 1.3.0 shipped on
# 12 Aug 2026 and carries none of the material3 alpha risk. `adaptive` supplies
# `currentWindowAdaptiveInfo()`, which is what tells the scaffold how much room the
# window has. `adaptive-layout` and `adaptive-navigation` are declared here for the
# pane scaffolds the tablet slice needs, and are not applied to a module yet.
material3Adaptive = "1.3.0"
# The audiobook player. Readium already drags media3 1.10.0 onto the runtime
# classpath — `:feature:epubreader:dependencies` shows `media3-session` and
# `media3-exoplayer` there — so this is a bump plus a *declaration*, not a new
# dependency: a transitive at runtime scope cannot be compiled against.
#
# 1.11.0 rather than 1.10.0 for one reason, checked rather than taken on trust:
# **MP4 chapter atoms**. ID3 CHAP frames already parse at 1.10.0, so the folder-of-
# MP3s path — the common library-service export — needs no bump at all. M4B is the
# format that does. See the change's `design.md`.
media3 = "1.11.0"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"
# A working `XmlPullParser` on the JVM. The Atom parser calls an Android API that the unit
# test JVM does not implement, and Android itself ships this implementation, so a test that
# parses a feed needs the pair rather than a stub that throws. Two modules parse feeds.
xmlpull = "1.1.3.1"
kxml2 = "2.3.0"
androidxJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
turbine = "1.2.1"
# Compose layout on the JVM. A chip row that runs off a narrow window at the
# largest text size is only observable in a real composition, and the unit gate
# has no device to compose on; Robolectric supplies the Android runtime the
# composition needs. Test-only, and only where a layout claim has to be pinned.
robolectric = "4.16.1"
materialIcons = "1.7.8"
kotlinxSerialization = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
readium-shared = { group = "org.readium.kotlin-toolkit", name = "readium-shared", version.ref = "readium" }
readium-streamer = { group = "org.readium.kotlin-toolkit", name = "readium-streamer", version.ref = "readium" }
readium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-navigator", version.ref = "readium" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }
androidx-compose-material-icons-extended ={ group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
xmlpull = { group = "xmlpull", name = "xmlpull", version.ref = "xmlpull" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# `network-share` needs SMB 2/3, which Android has no API for. ADR-0010.
jcifs-ng = { group = "eu.agno3.jcifs", name = "jcifs-ng", version.ref = "jcifsNg" }
# Declared only so :core:smb can constrain what jcifs-ng drags in. See the
# version note above — this is never added as a dependency.
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# The reading theme has to survive a close, and hand-rolling a JSON codec for a
# map of nested records is exactly the boilerplate this replaces.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
