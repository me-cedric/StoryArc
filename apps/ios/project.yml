name: StoryArc
options:
  bundleIdPrefix: app.storyarc
  deploymentTarget:
    # 26.1, not 26.0, and the reason is one API. `tabViewBottomAccessory(isEnabled:)` arrived
    # in 26.1; without it the shell reserves an empty capsule above the tab bar even with
    # nothing playing, so `read-aloud-beyond-the-reader`'s "no space is reserved for one" was
    # unmet on the floor itself. A point release is a small and shrinking audience cost, and
    # the alternative was a second code path through the shell that existed for one release
    # and would have outlived its reason.
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  # Task 12.6, owner answer O13. The CarPlay scene needs a scene manifest and the
  # `carplay-audio` entitlement, and this project has no Apple team to grant the entitlement
  # to a device build. So the simulator build alone carries both, and the CarPlay Simulator
  # (I/O, External Displays, CarPlay) can prove the scene. `Info.simulator.plist` is
  # `Info.plist` plus `CarSceneManifest.json`, written here on every generate. A device build
  # uses `Info.plist` and `StoryArc.entitlements`, which hold neither.
  # `CarSimulatorOnlyTests` fails if either device file gains a car key.
  postGenCommand: >-
    plutil -insert UIApplicationSceneManifest -json "$(cat App/CarSceneManifest.json)"
    -o App/Info.simulator.plist App/Info.plist

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No development team yet — see README. Device builds need one set.
    CODE_SIGN_STYLE: Automatic
    # Ad-hoc rather than unsigned. An unsigned app carries no entitlements, and with no
    # keychain access group `SecItemAdd` answers `errSecMissingEntitlement`: every source's
    # password was discarded the moment it was typed, on every simulator build anyone has
    # ever run, and nothing said so. Ad-hoc signing costs nothing and gives the app a
    # keychain.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_ENTITLEMENTS: App/StoryArc.entitlements
    # This line and `INFOPLIST_FILE[sdk=iphonesimulator*]` on the target are the only places
    # the CarPlay scene is switched on. See the note on `postGenCommand`. The device SDK
    # has no override of its own, on purpose.
    "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/StoryArc.simulator.entitlements

packages:
  StoryArcKit:
    path: Packages/StoryArcKit
  # Reflowable EPUB rendering, in its own package because Readium is iOS-only
  # and StoryArcKit also builds for macOS. See StoryArcEpub/Package.swift.
  StoryArcEpub:
    path: Packages/StoryArcEpub
  # Test-only, linked by `StoryArcSnapshotTests` and nothing else. MIT. Exact, like every other
  # remote package here: the version moves in a reviewed diff or it does not move.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  StoryArc:
    type: application
    platform: iOS
    sources:
      - path: App
        # Build inputs, not resources: a plist named by `INFOPLIST_FILE` in a Copy Bundle
        # Resources phase draws a warning, and the manifest JSON would ship in the bundle.
        excludes:
          - Info.simulator.plist
          - CarSceneManifest.json
    dependencies:
      - package: StoryArcKit
        product: DesignSystem
      - package: StoryArcKit
        product: StoryArcCore
      - package: StoryArcKit
        product: LibraryFeature
      - package: StoryArcKit
        product: ReaderFeature
      - package: StoryArcKit
        product: SettingsFeature
      - package: StoryArcKit
        product: Persistence
      - package: StoryArcKit
        product: Playback
      - package: StoryArcKit
        product: PlayerFeature
      # The app imports `Formats` itself. Without this line it links `Formats` only through
      # the Swift autolink entries in its object files. `StoryArcSnapshotTests` also links
      # `Formats`, so Xcode builds it as a dynamic framework, and an app object compiled
      # before that change has no `-framework Formats` entry. The link then fails with
      # "Undefined symbols" for `Formats` until a clean build.
      - package: StoryArcKit
        product: Formats
      - package: StoryArcEpub
        product: EpubReaderFeature
      # Embedded in the app, which is the only way WidgetKit finds a widget.
      - target: StoryArcWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StoryArc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # `page-transitions`: the curl runs "at the display's refresh rate including 120 Hz".
        # A ProMotion iPhone caps an app at 60 Hz unless this key is present, and it caps
        # `CADisplayLink` with it — so the panel draws at 120 and `FrameProbe` reports 60,
        # and every later measurement describes the cap rather than the shader. iPad has
        # never had the cap; this key is the iPhone half of the same rate.
        CADisableMinimumFrameDurationOnPhone: true
        # `ebook-reader`: read-aloud "continues" when the app is backgrounded, and the
        # platform media controls carry the title. iOS suspends an app that has not
        # declared this the moment it leaves the screen, so without the line the voice
        # stops mid-sentence and the lock screen shows nothing.
        # `library-sync` task 4.3: `fetch` lets iOS grant the sync a background refresh,
        # which it may skip. The identifier below is the one `LibrarySyncWiring.swift`
        # registers. No location, no processing.
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.storyarc.sync
        # `native-experience`: Handoff, and the same activity in Spotlight. iOS creates no
        # `NSUserActivity` for a type that is not declared here, so without this line the
        # reader's other device is never offered the book and nothing is indexed. See
        # `ReadingActivity`.
        NSUserActivityTypes:
          - app.storyarc.reading
        # `native-experience`: a tap on the home-screen widget opens a `storyarc:` URL, which
        # `QuickActionRequest(widgetURL:)` reads back. Nothing else answers this scheme, and it
        # can only open a book already in the library or the library itself.
        CFBundleURLTypes:
          - CFBundleURLName: app.storyarc.widget
            CFBundleURLSchemes:
              - storyarc
        # `local-library`: open a file where it lives rather than copying it in.
        LSSupportsOpeningDocumentsInPlace: true
        # And the other half of it: `local-library`'s imported copies live in the
        # app's Documents folder, so that folder has to be reachable from Files and
        # from Finder. Without this the imports exist and nobody can put anything
        # there.
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        # `opds-catalog` and `network-share` are about servers a reader runs at home, and
        # a Synology or a Raspberry Pi on the shelf usually answers over plain HTTP on a
        # `.local` name. App Transport Security blocks that by default, which would make
        # every self-hosted catalogue unreachable with no way to say why.
        #
        # `NSAllowsLocalNetworking` is the narrow exception: it permits insecure loads to
        # local hostnames and private-range addresses and nothing else. Arbitrary insecure
        # loads stay blocked, so a catalogue on the public internet must still be HTTPS —
        # which is why the address field completes a missing scheme to `https`, not `http`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Shown when the app first reaches a device on the same network. Says what for,
        # because "StoryArc would like to find devices" answers nothing.
        # `network-share` discovery: the one service type this app looks for. iOS refuses
        # a Bonjour browse for anything not listed here.
        NSBonjourServices:
          - _smb._tcp
        NSLocalNetworkUsageDescription: >-
          StoryArc connects to library servers you run yourself, such as a NAS or a
          Raspberry Pi on your own network.
        # `local-library` requires StoryArc to appear as a handler for every
        # format it can read, so an "Open with" from Files reaches the reader.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic archive
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - app.storyarc.cbz
              - app.storyarc.cbr
              - app.storyarc.cb7
              - app.storyarc.cbt
          - CFBundleTypeName: EPUB publication
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.adobe.pdf
          # Task 16.11: a single audio file and an M4B audiobook, so `local-library`'s
          # open-in and import reach an audiobook the way they already reach a comic,
          # an EPUB and a PDF. `xcodegen generate` writes `App/Info.plist` fresh from
          # this `info:` block on every `pnpm build:ios` — adding the dict to the
          # plist by hand instead is silently erased at the next generate.
          - CFBundleTypeName: Audiobook
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.mpeg-4-audio
              - public.mp3
              - public.audio
              - com.apple.protected-mpeg-4-audio-b
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.storyarc.cbz
            UTTypeDescription: Comic Book ZIP
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification: { public.filename-extension: [cbz] }
          - UTTypeIdentifier: app.storyarc.cbr
            UTTypeDescription: Comic Book RAR
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification: { public.filename-extension: [cbr] }
          - UTTypeIdentifier: app.storyarc.cb7
            UTTypeDescription: Comic Book 7-Zip
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification: { public.filename-extension: [cb7] }
          - UTTypeIdentifier: app.storyarc.cbt
            UTTypeDescription: Comic Book TAR
            UTTypeConformsTo: [public.tar-archive]
            UTTypeTagSpecification: { public.filename-extension: [cbt] }
        # `network-share` needs this to discover SMB hosts on the local network.
        # `network-share` discovery: the one service type this app looks for. iOS refuses
        # a Bonjour browse for anything not listed here.
        NSBonjourServices:
          - _smb._tcp
        NSLocalNetworkUsageDescription: >-
          StoryArc looks for SMB shares on your local network so you can add one
          without typing its address. You can always enter it by hand instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc
        "INFOPLIST_FILE[sdk=iphonesimulator*]": App/Info.simulator.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The four alternate faces `settings-and-about` lets a reader choose, and the reason
        # `setAlternateIconName` can find them at all: an `.appiconset` sitting in the
        # catalogue unnamed here is not built into the app, and asking for it fails at run
        # time with an error no compiler could have warned about.
        #
        # Ink is absent deliberately — it is `ASSETCATALOG_COMPILER_APPICON_NAME` above, and
        # UIKit spells the primary icon `nil` rather than by name. Listing it here and passing
        # "AppIcon" to `setAlternateIconName` both fail.
        #
        # **This belongs here and nowhere else.** `StoryArc.xcodeproj` is generated by
        # `xcodegen` and gitignored, so the same setting typed into Xcode's build settings is
        # gone at the next `pnpm build:ios` — and the icons would keep working in the
        # simulator that agent had open until somebody else's clean build.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - AppIcon-Paper
          - AppIcon-Bloom
          - AppIcon-Arc
          - AppIcon-Mono
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  # `native-experience` widgets, ADR-0011. The widget reads one file, the reading snapshot,
  # from the App Group container below; the app writes it. The group is named here, in the
  # app's two entitlement files and in `ReadingSnapshot.appGroup`, and `WidgetSigningTests`
  # fails if any of them drift.
  #
  # **Signing is the one step left, and it is the owner's.** There is no Apple team yet. The
  # simulator build runs ad-hoc, which needs no provisioning profile. A device build needs
  # `DEVELOPMENT_TEAM` set: automatic signing then registers both bundle identifiers and
  # the group. The bundle identifier must stay a child of the app's.
  StoryArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: StoryArcKit
        product: StoryArcCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: StoryArc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/StoryArcWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mecedric.storyarc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc.widget
        # The project's simulator override names the app's file. This one names the widget's.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Widget/StoryArcWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  # A UI test target exists for one reason: `performAccessibilityAudit` needs a running
  # app, and no unit test can give it one. It is the iOS counterpart of
  # `pnpm a11y:android`, which reads the Android accessibility tree off a device.
  #
  # Apple runs the audit, not us. That matters — it checks contrast, dynamic-type
  # clipping, hit-region size, element description and trait clash against the same
  # rules Xcode's own Accessibility Inspector uses, so the check cannot drift from the
  # platform's definition of correct.
  StoryArcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: StoryArc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc.UITests
        TEST_TARGET_NAME: StoryArc
        # Without this the target cannot be code-signed and the build fails before a
        # single test runs -- "Cannot code sign because the target does not have an
        # Info.plist file and one is not being generated automatically". A UI test bundle
        # has no plist of its own in this repository and does not want one; Xcode
        # generates what it needs. This is why the audit below had never been run.
        GENERATE_INFOPLIST_FILE: true

  # The screen catalogue (`docs/designs/screen-catalogue.md`), drawn with fixture data and
  # compared with the reference image beside each test (`lighter-visual-check`).
  #
  # **Hosted in the app, and that is the whole reason this is not a package test.** Liquid
  # Glass, blurs and `backgroundExtensionEffect` are drawn by the render server, and a test
  # process with no app has no window scene to draw them in: the Home hero came out as a white
  # card and every glass button as a ghost. Inside the app the key window is a real one, so the
  # image is what the display shows. It also reaches the views that live in the app target.
  #
  # Run it with `pnpm snap:ios`. The references sit in `SnapshotTests/__Snapshots__`.
  StoryArcSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: StoryArc
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: StoryArcKit
        product: DesignSystem
      - package: StoryArcKit
        product: StoryArcCore
      - package: StoryArcKit
        product: LibraryFeature
      - package: StoryArcKit
        product: ReaderFeature
      - package: StoryArcKit
        product: SettingsFeature
      - package: StoryArcKit
        product: Persistence
      - package: StoryArcKit
        product: Playback
      - package: StoryArcKit
        product: PlayerFeature
      - package: StoryArcKit
        product: Formats
      - package: StoryArcKit
        product: Catalogue
      - package: StoryArcEpub
        product: EpubReaderFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc.SnapshotTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StoryArc.app/StoryArc"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
