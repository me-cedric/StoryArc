[package]
name = "storyarc-core"
description = "Shared desktop core for StoryArc on Windows and Linux. No UI, ever."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# The vendored libarchive sources and the desktop-only config header it compiles.
build = "build.rs"

# The workspace forbids unsafe code. This crate lowers that to `deny` for one reason: the
# RAR decoder calls the vendored libarchive, and calling C is impossible without `unsafe`.
# `deny` can be lifted by exactly one module, `src/formats/libarchive_sys.rs`, which does so
# at its top with the reason written beside it; `forbid` could not be lifted at all. Every
# other module of this crate is still refused an `unsafe` block, and clippy stays at the
# workspace's own setting.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# AVIF decoding through libdav1d: `image`'s `avif-native` feature, which is the `dav1d`
# bindings (0.11.1, MIT) over the libdav1d system library (BSD-2-Clause, found through
# pkg-config) and `mp4parse` (0.17.0, MPL-2.0) for the container. Off by default because
# the CI runners and the distro containers do not install libdav1d; with it off an AVIF
# page is refused by name (task 2.5). Built and tested on a Mac with Homebrew's dav1d.
avif = ["image/avif-native"]
# HEIC decoding through `zune-heic`, pure Rust with its own HEVC decoder. On by default
# because it builds wherever the core builds; a packager who will not ship an HEVC decoder
# turns it off, and an HEIC page is then refused by name like an AVIF one.
heic = ["dep:zune-heic"]
default = ["heic"]

[dependencies]
# miniz_oxide 0.9.1, MIT OR Zlib OR Apache-2.0: raw DEFLATE for ZIP entries. ADR-0008 takes
# inflate from the platform; a Rust core has no platform inflate, and this is the pure-Rust
# one `flate2` itself wraps, with no C and no feature flags.
miniz_oxide = "0.9.1"
# regex-lite 0.1.9, MIT OR Apache-2.0: the filename conventions of `FilenameMetadata`, which
# iOS and Android express as regular expressions too. The dependency-free engine, because
# nine patterns over one short string need neither Unicode classes nor speed.
regex-lite = "0.1.9"
# rusqlite 0.40.2, MIT, with the bundled SQLite (public domain) compiled by cc, so the core
# carries one known SQLite on Windows and Linux rather than whatever the system ships. The
# local store of design.md, Decision 5; pinned exactly because task 2.1 pins it.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# serde 1.0.229 and serde_json 1.0.154, MIT OR Apache-2.0: the records that cross the seam
# as UTF-8 JSON (design.md, Decision 5), the stored positions, and the progress fixtures.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# sha2 0.11.1, MIT OR Apache-2.0: the content digest of ADR-0006 (SHA-256 over the length,
# the first and the last 512 KB), which must equal the hex the mobile apps write.
sha2 = "0.11.1"
# image 0.25.10, MIT OR Apache-2.0: JPEG, PNG, WebP and GIF page decoding, with every other
# format off so a crafted page reaches no decoder the reader was not promised.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# zune-heic 0.5.0, MIT OR Apache-2.0 OR Zlib, with zune-isobmff 0.5.0 (same licence) for the
# container: HEIC pages (task 2.5). Pure Rust and bit-identical to libheif by its own CI;
# libheif itself is LGPL-3.0 and libde265 LGPL-3.0, so neither is used. Pinned exactly: the
# crate is young and decodes untrusted input. Apple's VideoToolbox path is switched off in
# `image::decode` so every desktop runs the same decoder.
zune-heic = { version = "=0.5.0", optional = true }
# icu 2.3.1, Unicode-3.0: ICU4X collation, number and date formatting, and the normaliser
# the search fold uses, with the compiled data of every locale (design.md, Decision 5).
icu = "2.3.1"
# notify 8.2.0, CC0-1.0: the native folder watchers (inotify, ReadDirectoryChangesW,
# FSEvents) behind the watcher abstraction of task 2.3.
notify = "8.2.0"

[build-dependencies]
# cc 1.6.0, MIT OR Apache-2.0: compiles the vendored libarchive sources from build.rs, the
# third build system over the one copy under third_party/ (design.md, Decision 7). Pinned
# exactly because the design pins it.
cc = "=1.6.0"

[dev-dependencies]
# tempfile 3.27.0, MIT OR Apache-2.0: scratch folders for the scanner, watcher and store tests.
tempfile = "3.27.0"
