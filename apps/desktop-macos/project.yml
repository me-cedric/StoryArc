name: StoryArcMac
options:
  bundleIdPrefix: com.mecedric
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc, as in apps/ios: an unsigned app carries no entitlements, and the sandbox
    # entitlements below are what a local run has to prove.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_ENTITLEMENTS: App/StoryArcMac.entitlements

packages:
  # The same package the iOS app uses, consumed by path. Only DesignSystem and
  # StoryArcCore are linked. Feature products join as each desktop wave needs them.
  StoryArcKit:
    path: ../ios/Packages/StoryArcKit

targets:
  StoryArc:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: StoryArcKit
        product: DesignSystem
      - package: StoryArcKit
        product: StoryArcCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc
        PRODUCT_NAME: StoryArc
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StoryArc
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
