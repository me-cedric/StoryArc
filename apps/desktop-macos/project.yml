name: StoryArcMac
options:
  bundleIdPrefix: com.mecedric
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "7"
    # Ad-hoc, as in apps/ios: an unsigned app carries no entitlements, and the sandbox
    # entitlements below are what a local run has to prove.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_ENTITLEMENTS: App/StoryArcMac.entitlements

packages:
  # The same package the iOS app uses, consumed by path. Each desktop wave links the
  # products it needs; wave 2 adds the format layer and the comic reader's model.
  StoryArcKit:
    path: ../ios/Packages/StoryArcKit
  # The licence inventory the phone apps read, for the About tab's acknowledgements.
  licences:
    path: ../../packages/licences
  # The reading faces the phones bundle, for the EPUB reader (`ebook-reader`, *Bundled typefaces*).
  fonts:
    path: ../../packages/fonts

targets:
  StoryArc:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      # The one EPUB renderer of design.md Decision 6, built and pinned in
      # `apps/desktop-web/epub` (`pnpm epub:pin` checks its digest). The scheme handler serves
      # it to the web view; the app never loads a script from anywhere else.
      - path: ../desktop-web/epub/dist/storyarc-epub.js
        buildPhase: resources
      # The generated licence notices (`pnpm notices`), copied in at build so the About tab
      # shows the file the repository checks, PDFium and libarchive among it. Task 6.3.
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The thumbnail's cover rule, also compiled here so the app's tests hold it (task 5.4).
      - path: Thumbnails/ThumbnailCover.swift
    # Document types and the comic UTIs, carried over from `apps/ios/project.yml` with the
    # `UI` keys dropped (design.md Decision 2). `xcodegen generate` writes `App/Info.plist`
    # from this block on every `pnpm build:macos`; the file is gitignored and never edited.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StoryArc
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          StoryArc connects to library servers you run yourself, such as a NAS or a
          Raspberry Pi on your own network.
        NSBonjourServices:
          - _smb._tcp
        # The app's own link, `storyarc://publication/<title>` and `storyarc://source/<name>`
        # (task 5.8). `application(_:open:)` receives it like a file; `StoryArcLink` reads it.
        CFBundleURLTypes:
          - CFBundleURLName: com.mecedric.storyarc.link
            CFBundleURLSchemes: [storyarc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic archive
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - app.storyarc.cbz
              - app.storyarc.cbr
              - app.storyarc.cb7
              - app.storyarc.cbt
          - CFBundleTypeName: EPUB publication
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.adobe.pdf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.storyarc.cbz
            UTTypeDescription: Comic Book ZIP
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification: { public.filename-extension: [cbz] }
          - UTTypeIdentifier: app.storyarc.cbr
            UTTypeDescription: Comic Book RAR
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification: { public.filename-extension: [cbr] }
          - UTTypeIdentifier: app.storyarc.cb7
            UTTypeDescription: Comic Book 7-Zip
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification: { public.filename-extension: [cb7] }
          - UTTypeIdentifier: app.storyarc.cbt
            UTTypeDescription: Comic Book TAR
            UTTypeConformsTo: [public.tar-archive]
            UTTypeTagSpecification: { public.filename-extension: [cbt] }
    dependencies:
      # Finder's and Quick Look's covers, embedded in Contents/PlugIns. Task 5.4.
      - target: StoryArcThumbnails
        embed: true
      - package: StoryArcKit
        product: DesignSystem
      - package: StoryArcKit
        product: StoryArcCore
      # Wave 1: the destination set the sidebar lists, and the credential store the
      # Mac keychain wrapper delegates to.
      - package: StoryArcKit
        product: LibraryFeature
      - package: StoryArcKit
        product: Persistence
      # Wave 2: the archive openers and the indexer for files handed over, and the comic
      # reader's model, which decodes pages and records progress for the Mac page view.
      - package: StoryArcKit
        product: Formats
      - package: StoryArcKit
        product: ReaderFeature
      # Wave 3: the three kinds of server a reader can add, and the preferences' diagnostic.
      - package: StoryArcKit
        product: Catalogue
      - package: StoryArcKit
        product: Kavita
      - package: StoryArcKit
        product: Smb
      # Wave 4: the one player behind a narrated book and a voice, and its Now Playing.
      - package: StoryArcKit
        product: Playback
      # The player's artwork, and the coverless well every surface draws (`audio-playback`).
      - package: StoryArcKit
        product: PlayerFeature
      - package: licences
        product: StoryArcLicences
      - package: fonts
        product: StoryArcFonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc
        PRODUCT_NAME: StoryArc
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        # The brand accent, as on iOS. A copy of `apps/ios/App/Resources/Assets.xcassets/
        # AccentColor.colorset`: on a Mac whose system accent is Multicolor (the default) the
        # sidebar's selection and icons take it, which no SwiftUI tint reaches.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Drawn from the iOS icon by packaging/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  # The Quick Look thumbnail extension (task 5.4): a comic's or an ebook's cover as its icon
  # in Finder. Sandboxed with nothing else: Quick Look hands it read access to the one file.
  StoryArcThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - path: Thumbnails
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: Thumbnails/Info.plist
      properties:
        CFBundleDisplayName: StoryArc Thumbnails
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - app.storyarc.cbz
              - app.storyarc.cbr
              - app.storyarc.cbt
              - org.idpf.epub-container
            QLThumbnailMinimumDimension: 0
    dependencies:
      - package: StoryArcKit
        product: Formats
      - package: StoryArcKit
        product: StoryArcCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc.thumbnails
        PRODUCT_NAME: StoryArcThumbnails
        CODE_SIGN_ENTITLEMENTS: Thumbnails/StoryArcThumbnails.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # Hosted in the app on purpose. The process the tests run in is the ad-hoc signed,
  # sandboxed StoryArc.app, so the entitlement, bookmark and keychain tests measure what
  # a local run measures and not what an unsandboxed xctest runner would. XcodeGen sets
  # TEST_HOST and BUNDLE_LOADER from the target dependency.
  StoryArcMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "*.md"
          - "__Snapshots__/**"
      # The snapshot references, read from the bundle for the same reason as the fixtures
      # below. `Tests/MacSnapshot.swift` says how they are recorded.
      - path: Tests/__Snapshots__
        type: folder
        buildPhase: resources
      # Copied into the test bundle, never read from the checkout. The tests run inside the
      # sandboxed app, and a checkout under ~/Documents is a protected folder: an `open()` of
      # a path there waits on a privacy prompt nobody answers and the run hangs (measured
      # 2026-10-17). The bundle sits inside the app, which the sandbox always lets it read.
      - path: ../../packages/test-fixtures/comics
        type: folder
        buildPhase: resources
      # Wave 4: the ebooks the EPUB walks open, and the eight-vector egress page the Mac's
      # web view is measured with (`Tests/EpubEgressTests.swift`).
      - path: ../../packages/test-fixtures/ebooks
        type: folder
        buildPhase: resources
      - path: ../../packages/test-fixtures/audiobooks
        type: folder
        buildPhase: resources
      - path: ../desktop-web/epub/test/egress.html
        buildPhase: resources
      - path: App/StoryArcMac.entitlements
        buildPhase: resources
    dependencies:
      - target: StoryArc
      - package: StoryArcKit
        product: Persistence
      - package: StoryArcKit
        product: LibraryFeature
      - package: StoryArcKit
        product: StoryArcCore
      - package: StoryArcKit
        product: Formats
      - package: StoryArcKit
        product: Catalogue
      - package: StoryArcKit
        product: Smb
      - package: StoryArcKit
        product: Playback
      - package: licences
        product: StoryArcLicences
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mecedric.storyarc.Tests
        # As in apps/ios: without a generated plist the bundle cannot be signed and the
        # build stops before a test runs.
        GENERATE_INFOPLIST_FILE: YES
        # The project-level entitlements belong to the app. A test bundle signed with the
        # sandbox entitlement is a bundle that claims to be a sandboxed process.
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  # A shared scheme rather than the one Xcode makes up. The made-up scheme gathers coverage,
  # and with the test bundle and the app both linking `LibraryFeature`, Xcode turns the
  # package products into dynamic frameworks; libarchive's C framework then fails to link
  # against the profile runtime (`___llvm_profile_runtime`). No gate reads the coverage, so
  # it is off. Declared here rather than on the target so the test action alone carries the
  # settings below; a run from Xcode keeps the Mac's own language and region.
  StoryArc:
    build:
      targets:
        StoryArc: all
        StoryArcMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - StoryArcMacTests
      # The tests draw the app in English for the United States on every Mac, whatever the
      # Mac's own languages and region: the snapshot references hold words and numbers, and
      # a Mac set to a French region draws "36 %" where another draws "36%".
      language: en
      region: US
      # Scroll bars only while scrolling, as on a Mac with no mouse attached. With a mouse
      # the system shows them always, and every screen with a scroll view draws one.
      commandLineArguments:
        "-AppleShowScrollBars WhenScrolling": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
