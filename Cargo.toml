[workspace]
resolver = "3"
members = [
    "apps/desktop-core/storyarc-core",
    "apps/desktop-core/storyarc-ffi",
    "apps/desktop-linux",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/me-cedric/StoryArc"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The library document's key derivation runs 600,000 rounds of PBKDF2-HMAC-SHA256, which an
# unoptimised test build takes seconds over. The digest and cipher crates are built optimised
# in debug builds too, so `pnpm test:desktop:core` stays quick; nothing else changes.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
