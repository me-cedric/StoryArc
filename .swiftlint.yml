# SwiftLint runs from the repository root so it covers apps/ios in one pass.
included:
  - apps/ios

excluded:
  - apps/ios/Packages/StoryArcKit/Sources/DesignSystem/Generated
  - apps/ios/Packages/StoryArcKit/.build
  - apps/ios/Packages/StoryArcEpub/.build
  - apps/ios/StoryArc.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  # SwiftUI bodies nest deeply by nature; the type checker is the real guard.
  - type_body_length
  # Trailing commas in multi-line literals keep diffs to one line per change.
  - trailing_comma

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 2
  # `g` is Kavita's own age-rating label, copied from ComicInfo.xml v2.1 rather than named
  # by this app -- see `KavitaAgeRating`.
  excluded: [id, of, to, x, y, g]

file_length:
  warning: 400
  error: 800

function_body_length:
  warning: 50
  error: 100

custom_rules:
  # marmelroy/Zip 2.1.2 is linked into the app because ReadiumShared names it as a
  # target dependency, and its `Zip` module carries CVE-2023-39135 — a path traversal
  # on crafted entry names, fixed in the upstream master branch but never released.
  # Readium uses the package's `Minizip` C target and never the vulnerable `Zip`
  # module, and neither does anything here; the vulnerable routine is in the binary
  # with no caller, which is the only reason it is tolerable. This rule is what keeps
  # that true: the day someone reaches for the already-linked module, the build stops
  # instead of quietly inheriting the traversal. ADR-0014.
  #
  # The first branch matches every import spelling — attributes (`@testable`,
  # `@_implementationOnly`), access modifiers, submodule forms (`import class
  # Zip.Zip`) and trailing comments. The second catches a call site reached without a
  # local import, e.g. through a re-export. `\bZip\b` does not match `ZIPFoundation`
  # (case) or `ZipArchive` (word boundary), and comments and string literals are
  # excluded so that writing *about* the ban does not trip it.
  no_marmelroy_zip:
    name: "marmelroy/Zip is unpatched"
    regex: '^[ \t]*(@[A-Za-z_][A-Za-z0-9_]*[ \t]+)*(public|package|internal|fileprivate|private)?[ \t]*import[ \t]+([a-z]+[ \t]+)?Zip\b|\bZip\.(unzipFile|quickUnzipFile|zipFiles|quickZipFiles|zipData|addCustomFileExtension|removeCustomFileExtension|isValidFileExtension)\b'
    message: "Zip 2.1.2 carries a path traversal (CVE-2023-39135) with no fixed release. Use StoryArc's own ZipReader — ADR-0008, ADR-0014."
    excluded_match_kinds:
      - comment
      - doccomment
      - doccomment.field
      - string
    severity: error
