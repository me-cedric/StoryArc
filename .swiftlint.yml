# SwiftLint runs from the repository root so it covers apps/ios in one pass.
included:
  - apps/ios

excluded:
  - apps/ios/Packages/StoryArcKit/Sources/DesignSystem/Generated
  - apps/ios/Packages/StoryArcKit/.build
  - apps/ios/Packages/StoryArcEpub/.build
  - apps/ios/StoryArc.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  # SwiftUI bodies nest deeply by nature; the type checker is the real guard.
  - type_body_length
  # Trailing commas in multi-line literals keep diffs to one line per change.
  - trailing_comma

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded: [id, of, to, x, y]

file_length:
  warning: 400
  error: 800

function_body_length:
  warning: 50
  error: 100

custom_rules:
  # marmelroy/Zip 2.1.2 is linked into the app because ReadiumShared names it as a
  # target dependency, and it carries CVE-2023-39135 — a path traversal on crafted
  # entry names, with no fixed release in existence. Nothing calls it today, in
  # Readium or here, which is the only reason it is tolerable. This rule is what
  # keeps that true: the day someone reaches for the already-linked module, the
  # build stops instead of quietly inheriting the traversal. ADR-0014.
  no_marmelroy_zip:
    name: "marmelroy/Zip is unpatched"
    regex: '^\s*(public |internal |private |fileprivate |package )?import Zip\s*$'
    message: "Zip 2.1.2 carries an unfixed path traversal (CVE-2023-39135). Use StoryArc's own ZipReader — ADR-0008, ADR-0014."
    severity: error
