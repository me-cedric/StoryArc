name: Contract

# The specs and the design tokens are the only things both apps share. They are
# also the cheapest thing to check, so they gate every change.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Specs and design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` — package.json's `packageManager` field is the pin, and
      # specifying it twice is a hard error in this action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate capability specs
        run: pnpm spec:validate

      - name: Design token contrast gate
        # Fails on any text/surface pair below its WCAG floor, and on any
        # colour that falls outside the sRGB gamut.
        run: pnpm tokens:check

      - name: Generated tokens are in sync with their source
        run: pnpm tokens:verify

      - name: Third-party notices are in sync with the licence inventory
        # A notices file that disagrees with what the app ships is a compliance gap, not
        # a formatting one, and this is the only thing that would notice.
        run: pnpm notices:check

      - name: Vendored libarchive states one version everywhere, and is unpatched
        # libarchive is copied sources, so it has no lockfile entry and no advisory feed.
        # This is the only thing that would notice the tree, config.h, VENDORING.md and
        # the notices inventory drifting apart — which they had.
        run: pnpm libarchive:pin

      - name: The libarchive pin checker's own checks still fire
        run: pnpm libarchive:pin:selftest

      - name: The iOS app's dependency graph is committed and exactly pinned
        # StoryArc.xcodeproj is generated and ignored, so the app binary's lockfile is
        # the one file inside it that has to survive review. Cheap here, invisible
        # everywhere else.
        run: pnpm lockfile:ios

      - name: The iOS lockfile checker's own checks still fire
        run: pnpm lockfile:ios:selftest

      - name: The accessibility scanner's own checks still fire
        # A scanner that silently stops matching reports a clean screen, which is worse
        # than having no scanner. The device sweep cannot run here; its self-test can.
        run: pnpm a11y:selftest

      - name: Fixture corpus is in sync with its generator
        # The corpus is generated then committed, so it can go stale the same way
        # the tokens can. ubuntu-latest ships Python 3.
        run: pnpm fixtures:check
