name: Contract

# The specs and the design tokens are the only things both apps share. They are
# also the cheapest thing to check, so they gate every change.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Specs and design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `pnpm spec:guard` runs `docs/agent-compass/scripts/openspec-guard.mjs`, which
          # lives in a submodule. Without this the job dies on MODULE_NOT_FOUND, which is
          # what it did on every run until 2026-09-06.
          submodules: recursive

      # No `version:` — package.json's `packageManager` field is the pin, and
      # specifying it twice is a hard error in this action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # **One step, and that is the point.** This job used to name fifteen gates one at a
      # time, and `pnpm lint` chains twenty-one. The ten it did not name — the line caps, the
      # partial-task rule, the dropped-delta rule, the four-language string check, the three
      # mock-server self-tests, the redaction self-test, the commit-scope guard and the brand
      # gate — existed, passed locally, and were never run by CI at all. A list in two places
      # is a list that drifts, and this one had.
      #
      # `pnpm lint` names the failing script itself, so a red run still says which gate
      # refused. Add a gate to the `lint` chain in `package.json` and CI runs it the same day.
      - name: Every repository gate
        run: pnpm lint

      # The gates' own gates: a checker that has stopped matching reports a clean tree, which
      # is worse than no checker. Each of these feeds a known-bad input to one gate and fails
      # when the gate stays quiet.
      - name: The checkers' own checks still fire
        run: pnpm selftests
