name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'packages/**', 'third_party/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/**', 'third_party/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # AGP 9 requires JDK 17 or later; the project compiles to 21.
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        working-directory: apps/android
        # `warningsAsErrors` is on for :app — a lint warning fails the build.
        run: ./gradlew lint

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew test

      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Bundle release
        working-directory: apps/android
        # Unsigned — no keystore here. This runs for R8: the release build shrinks and
        # obfuscates, and a missing keep rule fails only in this configuration. Without
        # this step the first failure would be inside the release lane, with a version
        # code already spent.
        run: ./gradlew bundleRelease

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: apps/android/**/build/reports/lint-results-*.html
          retention-days: 7

      # **The unit tests had no report, and that cost a diagnosis.** On 2026-09-12 one case
      # failed here with `UncaughtExceptionsBeforeTest` — which names the *next* test, not the
      # one that leaked — and the run uploaded lint reports only. The failure did not
      # reproduce in three local runs, so the CI report was the only copy of what happened,
      # and it was thrown away with the runner.
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            apps/android/**/build/reports/tests/**
            apps/android/**/build/test-results/**
          retention-days: 7

  instrumented:
    name: Instrumented tests
    # Only on main. Booting an emulator costs several minutes, and the
    # instrumented suite exists for what cannot run on a host JVM: image decoding
    # and PDF rendering are framework stubs off-device, and the RAR decoder is a
    # JNI library that does not exist there at all. Pull requests stay fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # **Every module, not `:core:format` alone.** Six modules carry instrumented
          # sources and this ran one of them, so 102 of the 153 tests were compiled on
          # every push and executed on none. Two of those were broken and said so the
          # moment they ran, on 2026-09-12: a settings case asserted a swatch
          # announcement the screen had stopped making — `Colour #FFFFFF` for what now
          # says `White` — and a playback case read a resume offset as a file time when
          # `PlaybackPosition` states it is measured from the start of its part, so it
          # called a correct player wrong. A test that is compiled and never run looks
          # exactly like a test that passes.
          script: cd apps/android && ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: apps/android/**/build/reports/androidTests/**
          retention-days: 7
