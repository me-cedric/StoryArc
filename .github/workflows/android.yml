name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # AGP 9 requires JDK 17 or later; the project compiles to 21.
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        working-directory: apps/android
        # `warningsAsErrors` is on for :app — a lint warning fails the build.
        run: ./gradlew lint

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew test

      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: apps/android/**/build/reports/lint-results-*.html
          retention-days: 7
