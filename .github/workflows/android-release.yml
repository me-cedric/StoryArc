name: Android release

# A tag starts this. `pnpm release patch` writes the new version into
# `apps/android/gradle.properties`, commits, tags `vX.Y.Z` and pushes; this lane does
# everything after that and nothing before it.
#
# What it produces, in order:
#   1. a signed App Bundle and a signed APK, both at the version the tag carries
#   2. a GitHub release on that tag, with the APK attached for sideloading
#   3. that bundle on Play's internal testing track, rolled out to the internal testers
#
# Both carry the reader's notes of that version from `RELEASE_NOTES.md`.
#
# Internal testing first, because a release there reaches the testers in minutes and
# normally skips Play's review. The owner tries it, then promotes it to closed testing and
# later to production, in the Play Console or with `android-promote.yml`. Promotion to a
# closed or open track is what sends the build for review. A manual run may still choose
# another track or a draft.
#
# It never promotes. `android-promote.yml` does, and it reuses this artefact and never
# rebuilds.
#
# Secrets this needs, all five of them repository secrets:
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console service account key, the whole JSON document
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD   the keystore password
#   ANDROID_KEY_ALIAS           the key alias inside the keystore
#   ANDROID_KEY_PASSWORD        the key password
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to. internal is internal testing; alpha is the default closed testing track.'
        type: choice
        options: [internal, alpha, beta]
        default: internal
      releaseStatus:
        description: 'completed rolls it out on the track at once; on alpha or beta that sends it for review. draft waits for the owner in the Play Console.'
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  # Two uploads at once would race for the same version code. Queue them.
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, publish, upload to internal testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the version the repository carries
        id: version
        # `gradle.properties` is the single source of truth. Nothing here passes `-P`, so a
        # build from this lane is exactly the build anyone gets from the same commit.
        run: |
          NAME=$(grep -m1 '^versionName=' apps/android/gradle.properties | cut -d= -f2)
          CODE=$(grep -m1 '^versionCode=' apps/android/gradle.properties | cut -d= -f2)
          test -n "$NAME" && test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Read the reader's notes of this version
        # `pnpm release` filed them under the version. Play reads `<versionCode>.txt` from the
        # changelogs folder of each language; the GitHub release reads the same text.
        run: |
          DIR="$RUNNER_TEMP/play/en-US/changelogs"
          mkdir -p "$DIR"
          node scripts/release.mjs --notes "${{ steps.version.outputs.name }}" > "$RUNNER_TEMP/notes.txt"
          cp "$RUNNER_TEMP/notes.txt" "$DIR/${{ steps.version.outputs.code }}.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        # The action installs `tools platform-tools` by default, and command-line tools
        # 16.0 has no `tools` package, so its sdkmanager exits 1 and the job stops
        # before Gradle runs. Gradle fetches every other SDK part it needs itself.
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Write the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle and the APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Play takes the bundle; a reader who sideloads takes the APK. Both are signed by
        # the same key in the same run, so they are the same build.
        run: ./gradlew bundleRelease assembleRelease

      - name: The bundle carries the native symbols
        # Without them Play warns on the upload, and a native crash shows only addresses.
        run: unzip -l apps/android/app/build/outputs/bundle/release/app-release.aab | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'

      - name: Name the APK after its version
        # `app-release.apk` in a downloads list says nothing. `StoryArc-0.2.0.apk` does.
        run: cp apps/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/StoryArc-${{ steps.version.outputs.name }}.apk"

      - name: Keep the bundle and the mapping
        # R8 runs on release. Without the mapping file kept here as well as sent to Play,
        # a crash report from a tester is unreadable stack frames.
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.code }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # On a tag push the tag is already here. On a manual run it may not be, and
        # `gh release create` makes it at this commit.
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/StoryArc-${{ steps.version.outputs.name }}.apk" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Install fastlane
        # `supply` is the Play Developer API client both lanes use. The floor is pinned;
        # the patch level is not, because Play's API changes under it.
        # The runner's system gem directory is not writable by the build user.
        run: sudo gem install fastlane -N -v '~> 2.228'

      - name: Write the service account key
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"

      - name: Upload to internal testing
        env:
          TRACK: ${{ inputs.track || 'internal' }}
          RELEASE_STATUS: ${{ inputs.releaseStatus || 'completed' }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        # `internal` is internal testing and `alpha` the default closed track. A manual run
        # can name another track.
        run: |
          fastlane supply \
            --package_name com.mecedric.storyarc \
            --json_key "$RUNNER_TEMP/play.json" \
            --aab apps/android/app/build/outputs/bundle/release/app-release.aab \
            --mapping apps/android/app/build/outputs/mapping/release/mapping.txt \
            --track "$TRACK" \
            --release_status "$RELEASE_STATUS" \
            --version_name "$VERSION_NAME" \
            --metadata_path "$RUNNER_TEMP/play" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs false

      - name: Shred the credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
