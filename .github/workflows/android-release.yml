name: Android release

# The Android lane of release.yml (openspec change shared-release-train, design D4). A
# `vX.Y.Z` tag starts release.yml, and release.yml calls this.
#
# What it produces, in order:
#   1. a signed App Bundle and a signed APK, both at the version gradle.properties carries
#   2. the APK as the artefact `release-android`; release.yml attaches it to the draft release
#   3. that bundle on Play's internal testing track as a **draft**, with the reader's notes
#
# The owner rolls the draft out to the internal testers in the Play Console, then promotes it
# to closed testing and later to production, there or with `android-promote.yml`. Promotion
# to a closed or open track is what sends the build for review.
#
# A rehearsal builds and signs both files, and skips Play.
#
# A manual run is the one way to roll out at once: `releaseStatus: completed`, only when the
# owner asks for it. It uploads to Play and keeps the APK as an artefact; it makes no release.
#
# It never promotes. `android-promote.yml` does, and it reuses the uploaded bundle and never
# rebuilds.
#
# Secrets this needs, all five of them repository secrets:
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console service account key, the whole JSON document
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD   the keystore password
#   ANDROID_KEY_ALIAS           the key alias inside the keystore
#   ANDROID_KEY_PASSWORD        the key password
on:
  workflow_call:
    inputs:
      rehearsal:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to. internal is internal testing; alpha is the default closed testing track.'
        type: choice
        options: [internal, alpha, beta]
        default: internal
      releaseStatus:
        description: 'draft waits for the owner in the Play Console. completed rolls it out on the track at once; on alpha or beta that sends it for review.'
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

jobs:
  release:
    name: ${{ inputs.rehearsal && 'Build and sign' || 'Build, sign, upload a Play draft' }}
    runs-on: ubuntu-latest
    concurrency:
      # Two uploads at once would race for the same version code. Queue them; a rehearsal uploads nothing.
      group: ${{ inputs.rehearsal && format('android-rehearsal-{0}', github.ref) || 'android-play' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Read the version the repository carries
        id: version
        # `gradle.properties` is the single source of truth. Nothing here passes `-P`, so a
        # build from this lane is exactly the build anyone gets from the same commit.
        run: |
          NAME=$(grep -m1 '^versionName=' apps/android/gradle.properties | cut -d= -f2)
          CODE=$(grep -m1 '^versionCode=' apps/android/gradle.properties | cut -d= -f2)
          test -n "$NAME" && test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Read the reader's notes of this version
        # `pnpm release` filed them under the version. Play reads `<versionCode>.txt` from the
        # changelogs folder of each listing language. A rehearsal has no filed notes and no upload.
        if: ${{ !inputs.rehearsal }}
        run: node scripts/release.mjs --play-notes "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$RUNNER_TEMP/play"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        # The action installs `tools platform-tools` by default, and command-line tools
        # 16.0 has no `tools` package, so its sdkmanager exits 1 and the job stops
        # before Gradle runs. Gradle fetches every other SDK part it needs itself.
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Write the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle and the APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Play takes the bundle; a reader who sideloads takes the APK. Both are signed by
        # the same key in the same run, so they are the same build.
        run: ./gradlew bundleRelease assembleRelease

      - name: The bundle carries the native symbols
        # Without them Play warns on the upload, and a native crash shows only addresses.
        run: unzip -l apps/android/app/build/outputs/bundle/release/app-release.aab | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'

      - name: Name the APK after its version
        # `app-release.apk` in a downloads list says nothing. `StoryArc-0.2.0-android.apk` does.
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/StoryArc-${{ steps.version.outputs.name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

      - name: Keep the bundle and the mapping
        # R8 runs on release. Without the mapping file kept here as well as sent to Play,
        # a crash report from a tester is unreadable stack frames.
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.code }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Install fastlane
        if: ${{ !inputs.rehearsal }}
        # `supply` is the Play Developer API client both lanes use. The floor is pinned;
        # the patch level is not, because Play's API changes under it.
        # The runner's system gem directory is not writable by the build user.
        run: sudo gem install fastlane -N -v '~> 2.228'

      - name: Write the service account key
        if: ${{ !inputs.rehearsal }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"

      - name: Upload to internal testing
        if: ${{ !inputs.rehearsal }}
        env:
          TRACK: ${{ inputs.track || 'internal' }}
          RELEASE_STATUS: ${{ inputs.releaseStatus || 'draft' }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        # `internal` is internal testing and `alpha` the default closed track. A draft waits for
        # the owner in the Play Console. A manual run can name another track or `completed`.
        # A draft also commits its edit with changesNotSentForReview, so it never sends anything
        # for review, nor joins a submission that is already waiting there.
        run: |
          fastlane supply \
            --package_name com.mecedric.storyarc \
            --json_key "$RUNNER_TEMP/play.json" \
            --aab apps/android/app/build/outputs/bundle/release/app-release.aab \
            --mapping apps/android/app/build/outputs/mapping/release/mapping.txt \
            --track "$TRACK" \
            --release_status "$RELEASE_STATUS" \
            --version_name "$VERSION_NAME" \
            --metadata_path "$RUNNER_TEMP/play" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs false \
            --changes_not_sent_for_review "$([ "$RELEASE_STATUS" = draft ] && echo true || echo false)"

      - name: Shred the credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
