name: iOS

on:
  # `package.json` is deliberately absent, although the epub job runs
  # `pnpm test:ios:epub` from it. That file holds every tooling script and every
  # devDependency for both platforms, so listing it here starts all four macOS jobs
  # for an Android script, an OpenSpec script or a new lint step. The drift it would
  # guard against is one flag on one line, and the next iOS pull request catches it
  # anyway, because that reruns on any `apps/ios/**` change.
  push:
    branches: [main]
    paths: ['apps/ios/**', 'packages/**', 'third_party/**', '.github/workflows/ios.yml', '.swiftlint.yml']
  pull_request:
    paths: ['apps/ios/**', 'packages/**', 'third_party/**', '.github/workflows/ios.yml', '.swiftlint.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: StoryArcKit — build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        # The runner image's default Xcode is the contract. Printing it means a
        # toolchain drift shows up here rather than as a mysterious compile error.
        run: xcodebuild -version && swift --version

      # The pure-Swift targets build on the host, so the fast gate needs no
      # simulator runtime at all.
      - name: Test
        working-directory: apps/ios/Packages/StoryArcKit
        run: swift test

  epub:
    name: StoryArcEpub — build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        run: xcodebuild -version && swift --version

      # No `version:` — package.json's `packageManager` field is the pin. No
      # `pnpm install` either: the script runs `xcodebuild` and reads nothing from
      # `node_modules`, and `pnpm run` does not need the tree to be installed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Boot the simulator, and wait for the boot to finish, before `xcodebuild`
      # starts testing. `xcodebuild` boots it too, but it begins the run as soon as
      # the device answers rather than once its services are up — and the egress
      # tests measure a WebKit networking process that starts on a cold runtime.
      # On 2026-09-09 both of them failed with `networkNeverStarted` on a runner
      # that had never booted the device before the run.
      - name: Boot the simulator
        run: xcrun simctl bootstatus 'iPhone 17 Pro' -b

      # This package cannot be tested on the host: Readium is iOS-only, which is
      # the whole reason it is a separate package. A simulator is required.
      #
      # The script, not a copy of its command. The script passes
      # `-collect-test-diagnostics never`, and a copy here that lost that flag would
      # send a failing run off to collect a sysdiagnose from the simulator — a
      # collection that times out after 600 seconds, turning a thirteen-second answer
      # into an eleven-minute one at the moment the egress rule has just broken.
      - name: Test
        id: test
        run: pnpm test:ios:epub

      - name: Why the tests failed
        # `-quiet` hides assertion text. A failing run prints the failing test names,
        # `TEST FAILED` and exit code 65, and no expected or actual value for any case —
        # which is all the 2026-09-07 log held. The script writes a result bundle; this
        # reads the assertion text back out of it. A passing run stays silent.
        if: failure() && steps.test.conclusion == 'failure'
        run: pnpm why:ios:epub

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install swiftlint
      - run: swiftlint lint --strict

  app:
    name: App — build for simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        # The runner image's default Xcode is the contract. Printing it means a
        # toolchain drift shows up here rather than as a mysterious compile error.
        run: xcodebuild -version && swift --version

      - run: brew install xcodegen

      # The audit runs `pnpm test:ios:ui`, so this job needs pnpm. No `version:` —
      # package.json's `packageManager` field is the pin. No `pnpm install` either: the
      # script calls xcodegen and xcodebuild and reads nothing from `node_modules`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project StoryArc.xcodeproj \
            -scheme StoryArc \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Accessibility audit
        # Apple's own `performAccessibilityAudit`, which needs a running app and so cannot
        # be a unit test. It checks contrast, text clipped at large sizes, hit-region size
        # and missing element descriptions against the same rules the Accessibility
        # Inspector uses, so this cannot drift from what iOS considers correct.
        #
        # A booted simulator, not `generic/platform`: the audit reads a live view tree.
        #
        # The script, not a copy of its command, for the reason the epub job gives. This
        # one carries seven flags, and it is also the only way to run the audit locally:
        # `pnpm check:devices` calls the same script.
        id: audit
        run: pnpm test:ios:ui

      - name: Why the audit failed
        # Twelve audit failures on 2026-09-07 named twelve tests and gave no assertion
        # text, because `-quiet` prints none. This reads it out of the result bundle.
        if: failure() && steps.audit.conclusion == 'failure'
        run: pnpm why:ios:ui

      - name: Archive the audit result bundle
        # Zipped first, because `upload-artifact` roots the archive at the least common
        # ancestor of what it matched. Handed a single directory, that ancestor is the
        # directory itself, so the name `ui.xcresult` is stripped and the download
        # extracts as loose `Info.plist` and `Data/`, which no tool opens.
        if: failure() && steps.audit.conclusion == 'failure'
        run: cd .build/xcresult && zip -qr ui.xcresult.zip ui.xcresult

      - name: Upload the audit result bundle
        # An audit failure names a view and a rule. The screenshot of the clipped label
        # lives only in the bundle, so the summary above cannot replace this.
        if: failure() && steps.audit.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: .build/xcresult/ui.xcresult.zip
          retention-days: 7
