name: Desktop macOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop-macos/**'
      - 'apps/ios/Packages/StoryArcKit/**'
      - 'packages/**'
      - 'third_party/**'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'apps/desktop-macos/**'
      - 'apps/ios/Packages/StoryArcKit/**'
      - 'packages/**'
      - 'third_party/**'
      - '.github/workflows/desktop-macos.yml'

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: macOS app — build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        # The runner image's default Xcode is the contract, as in ios.yml.
        run: xcodebuild -version && swift --version

      - run: brew install xcodegen
      - run: mkdir -p .build

      - name: Generate project
        working-directory: apps/desktop-macos
        run: xcodegen generate

      - name: Build
        working-directory: apps/desktop-macos
        run: >-
          xcodebuild build
          -project StoryArcMac.xcodeproj
          -scheme StoryArc
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          -quiet

      # Signed ad hoc on purpose, unlike the build above: StoryArcMacTests is hosted in the
      # sandboxed app, so the entitlement, bookmark and keychain tests measure what a local
      # run measures. The ad-hoc identity needs no certificate on the runner.
      # No `pnpm install`: the collector and the mocks are plain Node scripts. They run in
      # the background so the egress tests (wave 4) and the source walks (wave 3) run rather
      # than skip; a test whose server is down skips by name, so a crash here is visible.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Start the egress collector and the mock servers
        run: |
          node apps/desktop-web/epub/test/collector.mjs > .build/egress.log 2>&1 &
          node scripts/opds-server.mjs > .build/opds.log 2>&1 &
          node scripts/kavita-server.mjs --port 5001 > .build/kavita.log 2>&1 &
          sleep 2
          for p in 4815 4444 5001; do nc -z 127.0.0.1 $p && echo "port $p up" || echo "port $p down"; done
      - name: Test
        id: test
        working-directory: apps/desktop-macos
        env:
          TEST_RUNNER_STORYARC_KAVITA_PORT: "5001"
        run: >-
          xcodebuild test
          -project StoryArcMac.xcodeproj
          -scheme StoryArc
          -destination 'platform=macOS'
          -resultBundlePath ../../.build/xcresult/mac.xcresult
          -quiet

      # `-quiet` keeps the failing test's own message out of the log, and the runner's Xcode is
      # not this Mac's, so a failure that only CI sees needs its message and its bundle here.
      - name: Report the failing tests
        if: failure() && steps.test.conclusion == 'failure'
        run: >-
          xcrun xcresulttool get test-results summary --path .build/xcresult/mac.xcresult
          | python3 -c 'import json,sys; d=json.load(sys.stdin); [print("-", f.get("testName"), "::", (f.get("failureText") or "").replace("\n", " ")) for f in d.get("testFailures", [])]'
      - name: Zip the result bundle
        if: failure() && steps.test.conclusion == 'failure'
        run: cd .build/xcresult && zip -qr mac.xcresult.zip mac.xcresult
      - name: Keep the result bundle
        if: failure() && steps.test.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mac-xcresult
          path: .build/xcresult/mac.xcresult.zip
          retention-days: 7
