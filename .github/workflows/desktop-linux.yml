name: Desktop Linux

# Desktop work stays in its own paths so the mobile lanes do not run for it.
on:
  pull_request:
    paths: &paths
      - Cargo.toml
      - Cargo.lock
      - apps/desktop-core/**
      - apps/desktop-linux/**
      - .github/workflows/desktop-linux.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p storyarc-core -p storyarc-ffi --all-targets -- -D warnings

  # The floor itself, outside a container: ubuntu-24.04 ships GTK 4.14 and libadwaita 1.5,
  # and the runner's own rustup toolchain compiles the crates. The core tests, the Linux
  # crate's tests, and one check the container rows cannot make because their repository
  # mount is read-only: storyarc-ffi's build.rs regenerates generated/NativeMethods.g.cs,
  # so a diff there means the committed C# declarations lag the Rust exports.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev
      - run: pkg-config --modversion gtk4 libadwaita-1
      - run: cargo test --locked -p storyarc-core -p storyarc-ffi
      - run: cargo test --locked -p storyarc-linux
      - name: The committed C# declarations match the Rust exports
        run: git diff --exit-code -- apps/desktop-core/storyarc-ffi/generated

  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-24.04, arch, manjaro, fedora]
    steps:
      - uses: actions/checkout@v4
      # Installs the distro's own GTK and libadwaita, then runs cargo test and cargo build.
      # Only the ubuntu-24.04 row lints storyarc-linux, because its toolchain comes from rustup.
      - run: apps/desktop-linux/scripts/container-build.sh ${{ matrix.distro }} ${{ matrix.distro == 'ubuntu-24.04' && '--clippy' || '' }}
